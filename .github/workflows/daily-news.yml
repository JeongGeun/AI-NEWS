name: Daily AI News Collection & Publish

on:
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC = 09:00 KST
  workflow_dispatch:       # 수동 실행

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run news collection pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect.py

      - name: Commit new post and seen_articles.json
        run: |
          git config user.name "AI News Bot"
          git config user.email "actions@github.com"
          git add _posts/ data/seen_articles.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: daily AI news $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
