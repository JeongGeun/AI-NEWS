name: Daily AI News Collection & Publish

on:
  schedule:
    - cron: "9 21 * * *"  # 21:09 UTC = 06:09 KST
  workflow_dispatch:       # 수동 실행

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run news collection pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect.py

      - name: Commit new post and seen_articles.json
        run: |
          git config user.name "AI News Bot"
          git config user.email "actions@github.com"
          git add _posts/ data/seen_articles.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: daily AI news $(date -u +%Y-%m-%d)"
            git push
          fi

