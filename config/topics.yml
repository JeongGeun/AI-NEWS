        sub_category: "community"
        max_items: 10
        keyword_filter: "community"
      - url: "https://hnrss.org/newest?q=LLM+AI+machine+learning+GPT&points=10"
        source: "Hacker News"
        sub_category: "community"
        max_items: 8
