topics:
  - slug: "ai"
    name: "AI"
    name_en: "AI"
    tab_order: 1
    tab_icon: "fas fa-robot"
    jekyll_category: "ai"
    llm_description: >
      Artificial intelligence, machine learning, LLMs, neural networks, AI research papers,
      AI model releases (GPT, Claude, Gemini, Llama, etc.), AI products, AI policy,
      AI tooling (LangChain, RAG, vector databases, embeddings, MLOps, LLMOps),
      AI coding assistants (Copilot, Cursor, Devin), and AI infrastructure.
    sub_category_labels:
      research: "연구 (Research)"
      industry: "산업 동향 (Industry)"
      news: "뉴스 (News)"
      developer: "개발자 (Developer)"
      community: "커뮤니티 (Community)"
      newsletter: "뉴스레터 (Newsletter)"
    rss_sources:
      # arXiv
      - url: "https://rss.arxiv.org/rss/cs.AI"
        source: "arXiv cs.AI"
        sub_category: "research"
        max_items: 10
        keyword_filter: "arxiv"
      - url: "https://rss.arxiv.org/rss/cs.LG"
        source: "arXiv cs.LG"
        sub_category: "research"
        max_items: 10
        keyword_filter: "arxiv"
      - url: "https://rss.arxiv.org/rss/cs.CL"
        source: "arXiv cs.CL"
        sub_category: "research"
        max_items: 10
        keyword_filter: "arxiv"
      # Industry blogs
      - url: "https://huggingface.co/blog/feed.xml"
        source: "HuggingFace Blog"
        sub_category: "industry"
        max_items: 5
      - url: "https://deepmind.google/blog/feed/basic/"
        source: "Google DeepMind Blog"
        sub_category: "industry"
        max_items: 5
      - url: "https://blog.google/technology/ai/rss/"
        source: "Google AI Blog"
        sub_category: "industry"
        max_items: 5
      # News
      - url: "https://venturebeat.com/category/ai/feed/"
        source: "VentureBeat AI"
        sub_category: "news"
        max_items: 8
      - url: "https://techcrunch.com/category/artificial-intelligence/feed/"
        source: "TechCrunch AI"
        sub_category: "news"
        max_items: 8
      - url: "https://www.technologyreview.com/feed/"
        source: "MIT Technology Review"
        sub_category: "news"
        max_items: 5
      - url: "https://www.theverge.com/ai-artificial-intelligence/rss/index.xml"
        source: "The Verge AI"
        sub_category: "news"
        max_items: 5
      - url: "https://thegradient.pub/rss/"
        source: "The Gradient"
        sub_category: "research"
        max_items: 3
      # Community & Curation
      - url: "https://news.hada.io/rss"
        source: "GeekNews"
        sub_category: "community"
        max_items: 10
        keyword_filter: "community"
      - url: "https://hnrss.org/newest?q=LLM+AI+machine+learning+GPT&points=10"
        source: "Hacker News"
        sub_category: "community"
        max_items: 8
      - url: "https://www.reddit.com/r/MachineLearning/.rss"
        source: "Reddit r/MachineLearning"
        sub_category: "community"
        max_items: 5
        keyword_filter: "community"
      - url: "https://www.reddit.com/r/LocalLLaMA/.rss"
        source: "Reddit r/LocalLLaMA"
        sub_category: "community"
        max_items: 5
      # Developer tools & AI engineering
      - url: "https://github.blog/category/ai/feed/"
        source: "GitHub Blog (AI)"
        sub_category: "developer"
        max_items: 5
      - url: "https://stackoverflow.blog/feed/"
        source: "Stack Overflow Blog"
        sub_category: "developer"
        max_items: 5
        keyword_filter: "developer"
      - url: "https://simonwillison.net/atom/everything/"
