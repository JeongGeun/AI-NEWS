  - slug: "beauty"
    name: "뷰티"
    name_en: "Beauty"
    tab_order: 5
    tab_icon: "fas fa-spa"
    jekyll_category: "beauty"
    llm_description: >
      Skincare products and routines: moisturizers, serums, toners, cleansers, sunscreens,
      active ingredients (retinol, vitamin C, niacinamide, hyaluronic acid, AHA/BHA, ceramide, peptides),
      skin concerns (acne, anti-aging, hyperpigmentation, sensitive skin, skin barrier),
      K-beauty skincare brands and products (COSRX, Laneige, Innisfree, Sulwhasoo, etc.),
      Korean skincare trends and innovations, sheet masks, skincare market/industry news,
      dermatology-backed skincare, and skincare product launches and reviews.
    sub_category_labels:
      kbeauty: "K-뷰티 스킨케어"
      industry: "산업 동향"
      trends: "트렌드"
      news: "뉴스"
    rss_sources:
      # ── 한국어 소스 (우선순위) ──────────────────────────────────
      # Google 뉴스 한국 — 스킨케어
      - url: "https://news.google.com/rss/search?q=%EC%8A%A4%ED%82%A8%EC%BC%80%EC%96%B4&hl=ko&gl=KR&ceid=KR:ko"
        source: "Google 뉴스 (스킨케어)"
        sub_category: "trends"
        max_items: 10
      # Google 뉴스 한국 — 화장품 성분
      - url: "https://news.google.com/rss/search?q=%ED%99%94%EC%9E%A5%ED%92%88+%EC%84%B1%EB%B6%84&hl=ko&gl=KR&ceid=KR:ko"
        source: "Google 뉴스 (화장품 성분)"
        sub_category: "trends"
        max_items: 8
      # Google 뉴스 한국 — 피부 보습/미백
      - url: "https://news.google.com/rss/search?q=%ED%94%BC%EB%B6%80+%EB%B3%B4%EC%8A%B5&hl=ko&gl=KR&ceid=KR:ko"
        source: "Google 뉴스 (피부 보습)"
        sub_category: "trends"
        max_items: 8
      # Google 뉴스 한국 — K뷰티 산업
      - url: "https://news.google.com/rss/search?q=K%EB%B7%B0%ED%8B%B0+%ED%99%94%EC%9E%A5%ED%92%88&hl=ko&gl=KR&ceid=KR:ko"
        source: "Google 뉴스 (K뷰티)"
        sub_category: "kbeauty"
        max_items: 8
      # 코스인코리아 — 화장품 산업 전문지 (skincare 필터 없이, 사이트 자체가 뷰티 전문)
      - url: "https://news.google.com/rss/search?q=site:cosinkorea.com&hl=ko&gl=KR&ceid=KR:ko"
        source: "코스인코리아"
        sub_category: "industry"
        max_items: 10
        keyword_filter: "skincare"
      # 뷰티경제 (뷰티누리) — SSL 핸드셰이크 문제로 Google News 프록시 사용
      - url: "https://news.google.com/rss/search?q=site:beautynury.com&hl=ko&gl=KR&ceid=KR:ko"
        source: "뷰티경제"
        sub_category: "industry"
        max_items: 8
        keyword_filter: "skincare"
      # ── 영어 소스 (K-뷰티 해외 시각, 보조) ───────────────────
      - url: "https://news.google.com/rss/search?q=korean+skincare+kbeauty&hl=en-US&gl=US&ceid=US:en"
        source: "Google News (K-beauty Skincare)"
        sub_category: "kbeauty"
        max_items: 5
      - url: "https://news.google.com/rss/search?q=site:allure.com+skincare&hl=en-US&gl=US&ceid=US:en"
        source: "Allure Skincare"
        sub_category: "trends"
        max_items: 3
      - url: "https://cosmeticsbusiness.com/rss"
        source: "Cosmetics Business"
        sub_category: "industry"
        max_items: 3
        keyword_filter: "skincare"
