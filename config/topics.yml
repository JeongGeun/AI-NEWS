        max_items: 5
      - url: "https://blog.langchain.dev/rss/"
        source: "LangChain Blog"
        sub_category: "developer"
        max_items: 5
      - url: "https://dev.to/feed/"
        source: "Dev.to"
        sub_category: "developer"
        max_items: 5
        keyword_filter: "developer"
