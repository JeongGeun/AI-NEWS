theme: jekyll-theme-chirpy

lang: ko
timezone: Asia/Seoul

title: 테크 뉴스 데일리
tagline: AI, 프론트엔드, 백엔드, DevOps 뉴스를 매일 한국어로
description: >-
  AI, 프론트엔드, 백엔드, DevOps/인프라 분야의 기술 뉴스를
  Claude AI가 매일 자동 수집하여 한국어로 요약합니다.

# LLM 검색 기능 (Vercel Function)
llm_search_worker_url: "https://vercel-one-opal.vercel.app/api/search"

url: "https://jeonggeunjo.github.io"
baseurl: "/AI-NEWS"

github:
  username: jeonggeunjo

social:
  name: AI News Bot
  email: ""
  links: []

google_analytics:
  id: ""

theme_mode: light

avatar: ""
toc: true

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      math: false
      mermaid: false
  - scope:
      path: "_drafts"
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - scripts/
  - data/
  - config/
  - vercel/
  - requirements.txt

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
