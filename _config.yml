theme: jekyll-theme-chirpy

lang: ko
timezone: Asia/Seoul

title: AI 뉴스 데일리
tagline: 매일 아침 AI 뉴스를 한국어로
description: >-
  arXiv 논문, HuggingFace 블로그, VentureBeat, TechCrunch 등에서
  수집한 AI 뉴스를 Claude AI가 한국어로 요약합니다.

url: "https://jeonggeunjo.github.io"
baseurl: "/AI-NEWS"

github:
  username: jeonggeunjo

social:
  name: AI News Bot
  email: ""
  links: []

google_analytics:
  id: ""

theme_mode: light

avatar: ""
toc: true

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      math: false
      mermaid: false
  - scope:
      path: "_drafts"
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - scripts/
  - data/
  - requirements.txt

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
